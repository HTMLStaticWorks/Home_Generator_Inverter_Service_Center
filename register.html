<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — GRID SYSTEMS</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <!-- Font Awesome & Phosphor Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/style.css">
  <!-- Main Design Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- RTL Stylesheet -->
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body style="min-height: 100vh; overflow-y: auto;">

  <!-- Floating Top Navigation Controls -->
  <div style="position: absolute; top: var(--space-4); right: var(--space-6); display: flex; gap: var(--space-3); align-items: center; z-index: 100;">
    
    <button class="toggle-btn rtl-toggle" aria-label="Toggle Direction">⇆</button>
    <button class="toggle-btn theme-toggle" aria-label="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
  </div>

  <!-- Centered Auth Wrapper -->
  <div class="auth-wrapper" style="padding: var(--space-12) 0;">
    <div class="auth-container">
      <a href="index.html" class="auth-logo" style="text-decoration: none; display: inline-block;">
        <i class="fa-solid fa-microchip" style="color: var(--accent);"></i> GRID <span>SYSTEMS</span>
      </a>
      <h2 class="auth-title">Create Engineer Account</h2>

      <form id="register-form" data-validate>
        <div class="form-group">
          <label for="register-name" class="form-label">Full Name</label>
          <input type="text" id="register-name" required class="form-control" placeholder="Arthur Cole">
        </div>

        <div class="form-group">
          <label for="register-email" class="form-label">Email Address</label>
          <input type="email" id="register-email" required class="form-control" placeholder="arthur@grid-systems.com">
        </div>

        <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
          <div class="form-group">
            <label for="register-password" class="form-label">Password</label>
            <input type="password" id="register-password" name="password" required class="form-control" placeholder="••••••••">
          </div>
          
          <div class="form-group">
            <label for="register-confirm" class="form-label">Confirm Password</label>
            <input type="password" id="register-confirm" name="confirm-password" required class="form-control" placeholder="••••••••">
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="register-terms" name="terms" required>
          <label for="register-terms">I accept the Terms & Conditions and privacy policy.</label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: var(--space-4);">Register</button>
      </form>

      <!-- OAuth Section -->
      <div class="oauth-divider">or continue with</div>
      
      <div class="oauth-buttons">
        <button class="btn-oauth">
          <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>

        <button class="btn-oauth">
          <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.2.67-2.92 1.49-.62.71-1.16 1.85-1.01 2.96 1.12.09 2.27-.58 2.94-1.39z" fill="currentColor"/>
          </svg>
          Continue with Apple
        </button>
      </div>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <!-- Main scripts -->
  <script src="assets/js/main.js"></script>
</body>
</html>
